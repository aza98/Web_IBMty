name: Deploy to IBMty
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Deploy via FTP (Sync Changes Only)
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FRPHOSTNAME }}
        username: ${{ secrets.FTPUSERNAME }}
        password: ${{ secrets.FTPPASSWORD }}
        server-dir: /ibmty/
        log-level: verbose
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.github/**
          **/.DS_Store**
          **/.claude/**
          **/.agents/**
          **/.codex/**
          **/.impeccable/**
          **/design-handoff/**
          **/docs/**
          **/CLAUDE.md
          **/AGENTS.md
          **/skills-lock.json